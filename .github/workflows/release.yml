name: Release APK

# 推送 v* tag（如 v0.2.0）→ 构建签名 release APK → 发布到 GitHub Release。
# app 内「检查更新」会查到这个 Release 并覆盖安装。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :airsonic-demo:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp airsonic-demo/build/outputs/apk/release/*.apk "out/AirSonic-${GITHUB_REF_NAME}.apk"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/AirSonic-${{ github.ref_name }}.apk
          generate_release_notes: true
